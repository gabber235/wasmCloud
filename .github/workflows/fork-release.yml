name: fork-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New fork release tag, for example typewriter-v2.10.3-1"
        required: true
        type: string

permissions: {}

concurrency:
  group: fork-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    if: github.repository == 'gabber235/wasmCloud' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the new release
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"typewriter-v" + re.escape(version) + r"-[1-9][0-9]*", tag):
              raise SystemExit(f"tag must match typewriter-v{version}-<positive revision>")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={tag}\nversion={version}\nsha={os.environ['GITHUB_SHA']}\n")
          PYTHON
          existing_tag=$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")
          if [[ -n "$existing_tag" ]]; then
            echo "Refusing to replace existing tag ${RELEASE_TAG}" >&2
            exit 1
          fi
          releases=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[].tag_name')
          if [[ $'\n'"${releases}"$'\n' == *$'\n'"${RELEASE_TAG}"$'\n'* ]]; then
            echo "Refusing to replace existing release ${RELEASE_TAG}" >&2
            exit 1
          fi

  test:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/setup-rust
        with:
          rust-toolchain: "1.96.0"
      - name: Build component fixtures
        run: cargo xtask build-fixtures
      - name: Test CLI and runtime
        run: cargo test --locked -p wash -p wash-runtime --lib
      - name: Test ingress lifetime and NATS routing
        run: cargo test --locked -p wash-runtime --test integration_ingress_release --test integration_nats_plugin -- --include-ignored

  build:
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/free-disk-space
        if: runner.os == 'Linux'
      - uses: ./.github/actions/setup-rust
        with:
          rust-toolchain: "1.96.0"
          rust-targets: ${{ matrix.target }}
          install-zigbuild: ${{ runner.os == 'Linux' }}
      - name: Build and verify the release binary
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
          CARGO_NET_RETRY: "10"
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cargo zigbuild --locked --release --target "${TARGET}.2.17" -p wash
          else
            cargo build --locked --release --target "$TARGET" -p wash
          fi
          mkdir -p dist
          cp "target/${TARGET}/release/wash" "dist/wash-${TARGET}"
          test "$("dist/wash-${TARGET}" --version)" = "wash ${VERSION}"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            docker run --rm --volume "${PWD}/dist/wash-${TARGET}:/usr/local/bin/wash:ro" \
              rust:1.95-bookworm wash --version
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-wash-${{ matrix.target }}
          path: dist/wash-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fork-wash-*
          merge-multiple: true
          path: dist
      - name: Record source and checksums
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path("dist")
          names = ["wash-aarch64-apple-darwin", "wash-aarch64-unknown-linux-gnu", "wash-x86_64-unknown-linux-gnu"]
          if sorted(path.name for path in dist.iterdir()) != names:
              raise SystemExit("release must contain exactly the three expected binaries")
          checksums = {name: hashlib.sha256((dist / name).read_bytes()).hexdigest() for name in names}
          metadata = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["SOURCE_SHA"],
              "tag": os.environ["RELEASE_TAG"],
              "upstream_version": os.environ["VERSION"],
              "rust_toolchain": "1.96.0",
              "cargo_features": "default",
              "linux_glibc_minimum": "2.17",
              "sha256": checksums,
          }
          (dist / "release.json").write_text(json.dumps(metadata, indent=2) + "\n")
          (dist / "checksums.sha256").write_text("".join(f"{digest}  {name}\n" for name, digest in checksums.items()))
          Path("release-notes.md").write_text(
              f"Typewriter wasmCloud fork based on upstream {os.environ['VERSION']}.\n\n"
              f"Source commit: `{os.environ['SOURCE_SHA']}`.\n\n"
              "Includes the retained Typewriter runtime patches and the dependency security fixes recorded in docs/typewriter-patches.md. "
              "Nix and Dagger consume these exact binaries using SHA256 digests.\n"
          )
          PYTHON
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/* --draft --target "$SOURCE_SHA" \
            --title "wash ${RELEASE_TAG}" --notes-file release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
